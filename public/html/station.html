<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>station</title>
        <link rel="stylesheet" href="/css/header.css">
        <link rel="stylesheet" href="/css/station.css">
</head>
<body>
    <div id="header-container"></div>
    <div class="ticket-container">
        <div id="dishList"></div>
    </div>

    <button id="configuration">
        <img src="/icons/free-icon-wrench-and-bolt-tool-with-hammer-28491.png" alt="Конфигурации" width="50" height="50">
    </button>

    <div id="modalOverlay" class="hidden">

        <div class="modal">

            <div class="modal-header">

                <h2>Конфигурация станции</h2>
                
                <button id="closeModal">✕</button>
                
            </div>
            
            <div class="modal-body">
                <div class="settings-group">

                    <label>
                        <input type="checkbox" class="status-filter" data-status="NEW">
                        Новые заказы
                    </label>
                    <label>
                        <input type="checkbox" class="status-filter" data-status="READY">
                        Приготовлено
                    </label>
    
                    <label>
                        <input type="checkbox" class="status-filter" data-status="GIVEN">
                        Отдано
                    </label>
                </div>

                <!-- Здесь потом будут категории -->

            </div>

        </div>

    </div>

    <script src="/js/header.js" defer></script>
    <script src="/js/station.js" defer></script>
</body>
</html>
